[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "encryption-suite-v2"
version = "2.0.0"
description = "Enterprise-grade encryption/decryption suite with post-quantum support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Yashas", email = "yashas@example.com" },
]
keywords = ["encryption", "cryptography", "post-quantum", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.111.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
aws = ["boto3>=1.34.0"]
vault = ["hvac>=2.1.0"]
pqc = ["liboqs-python>=0.9.0"]
ui = ["streamlit>=1.35.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "bandit>=1.7.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
]
all = ["encryption-suite-v2[aws,vault,pqc,ui,dev]"]

[project.scripts]
crypto = "encryption_suite_v2.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "A", "UP", "RUF"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disable_error_code = [
    "arg-type",
    "misc",
    "no-any-return",
    "no-untyped-def",
    "type-arg",
    "untyped-decorator",
    "unused-ignore",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]
