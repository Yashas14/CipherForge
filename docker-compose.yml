services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CRYPTO_FIPS_MODE=0
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ui:
    build: .
    command: ["python", "-m", "streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - CRYPTO_FIPS_MODE=0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
